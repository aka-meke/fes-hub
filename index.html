const START_HOUR=11,END_HOUR=29,HOUR_PX=78,MIN_PX=HOUR_PX/60,DEFAULT_DURATION_MIN=50;
let currentDay='0815';let selected=null;let bookmarks=loadBookmarks();
function toMinutes(t){const p=t.split(':').map(Number);return p[0]*60+p[1];}
function topPx(t){return (toMinutes(t)-START_HOUR*60)*MIN_PX;}
function durPx(min){return min*MIN_PX;}
function eventKey(day,stageId,time,artist){return day+'|'+stageId+'|'+time+'|'+artist;}
function loadBookmarks(){try{return JSON.parse(localStorage.getItem('fesYoutubeBookmarks')||'{}')}catch(e){return {}}}
function saveBookmarks(){localStorage.setItem('fesYoutubeBookmarks',JSON.stringify(bookmarks));}
function buildTimeAxis(right=false){const axis=document.createElement('div');axis.className='time-axis'+(right?' right':'');for(let h=START_HOUR;h<=END_HOUR;h++){const tick=document.createElement('div');tick.className='tick';tick.style.top=((h-START_HOUR)*HOUR_PX)+'px';tick.textContent=h+' 00';axis.appendChild(tick)}return axis;}
function eventDuration(list,i){const current=toMinutes(list[i][0]);const next=list[i+1]?toMinutes(list[i+1][0]):current+DEFAULT_DURATION_MIN;return Math.max(42,Math.min(DEFAULT_DURATION_MIN,next-current-15));}
function getEventSpan(day,stageId,index){const list=DATA[day].stages[stageId];const start=toMinutes(list[index][0]);const dur=eventDuration(list,index);return {start,end:start+dur,artist:list[index][1],time:list[index][0]};}
function overlaps(a,b){return a.start < b.end && b.start < a.end;}
function favoriteSpans(day){const spans=[];STAGE_INFO.forEach(st=>{(DATA[day].stages[st.id]||[]).forEach((item,i)=>{const k=eventKey(day,st.id,item[0],item[1]);if(bookmarks[k]) spans.push({...getEventSpan(day,st.id,i),key:k,stageId:st.id});});});return spans;}
function shouldDim(day,stageId,index,key){if(bookmarks[key]) return false;const favs=favoriteSpans(day);if(!favs.length) return false;const mine=getEventSpan(day,stageId,index);return favs.some(f=>overlaps(mine,f));}
function dayArtists(day=currentDay){const arr=[];STAGE_INFO.forEach(st=>(DATA[day].stages[st.id]||[]).forEach(item=>arr.push({day,stageId:st.id,stageName:st.name,time:item[0],artist:item[1]})));return arr.sort((a,b)=>toMinutes(a.time)-toMinutes(b.time));}
function allArtists(){return ['0814','0815'].flatMap(day=>dayArtists(day));}
function bookmarkedArtists(){return allArtists().filter(a=>bookmarks[eventKey(a.day,a.stageId,a.time,a.artist)]);}
function uniqueVideosFromArtists(artists){const seen=new Set();const out=[];artists.forEach(a=>{(VIDEO_DB[a.artist]||[]).forEach(v=>{if(v.videoId&&!seen.has(v.videoId)){seen.add(v.videoId);out.push({...v,artist:a.artist,day:DATA[a.day].label,time:a.time,stage:a.stageName});}})});return out;}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function render(){document.getElementById('day0814').classList.toggle('active',currentDay==='0814');document.getElementById('day0815').classList.toggle('active',currentDay==='0815');const root=document.getElementById('timetable');root.innerHTML='';root.appendChild(document.createElement('div')).className='time-head';STAGE_INFO.forEach(s=>{const h=document.createElement('div');h.className='stage-head '+s.cls;h.textContent=s.name;root.appendChild(h);});root.appendChild(document.createElement('div')).className='time-head';root.appendChild(buildTimeAxis(false));STAGE_INFO.forEach(stage=>{const col=document.createElement('div');col.className='stage '+stage.cls;const list=DATA[currentDay].stages[stage.id]||[];list.forEach((item,i)=>{const [time,artist]=item;const key=eventKey(currentDay,stage.id,time,artist);const ev=document.createElement('button');ev.type='button';ev.className='event';if(bookmarks[key]) ev.classList.add('bookmarked');if(shouldDim(currentDay,stage.id,i,key)) ev.classList.add('dimmed');ev.style.setProperty('--top',topPx(time));ev.style.setProperty('--dur',durPx(eventDuration(list,i)));ev.dataset.artist=artist;ev.dataset.time=time;ev.dataset.stage=stage.name;ev.dataset.key=key;ev.innerHTML='<span class="time"></span><span class="artist"></span><span class="star" title="ブックマーク">☆</span>';ev.querySelector('.time').textContent=time+' -';ev.querySelector('.artist').textContent=artist;const star=ev.querySelector('.star');if(bookmarks[key]){star.textContent='★';star.classList.add('on')}star.addEventListener('click',e=>{e.stopPropagation();toggleBookmark(key);});ev.addEventListener('click',()=>selectArtist(ev));col.appendChild(ev);});root.appendChild(col);});root.appendChild(buildTimeAxis(true));updateBookmarkSummary();}
function toggleBookmark(key){if(bookmarks[key]) delete bookmarks[key];else bookmarks[key]=true;saveBookmarks();render();}
function updateBookmarkSummary(){const count=Object.keys(bookmarks).filter(k=>k.startsWith(currentDay+'|')).length;const el=document.getElementById('bookmarkSummary');if(el)el.textContent=count?('この日の★：'+count+'件。時間が被る未選択枠を薄く表示します。'):'★を付けると、同じ時間帯に被る他アーティストを薄く表示します。';}
function selectArtist(el){document.querySelectorAll('.event.selected').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');selected={artist:el.dataset.artist,time:el.dataset.time,stage:el.dataset.stage,day:DATA[currentDay].label};document.getElementById('selectedTitle').textContent=selected.artist;document.getElementById('selectedMeta').textContent=selected.day+' / '+selected.stage+' / '+selected.time+' start';renderVideos(VIDEO_DB[selected.artist]||[], selected.artist);}
function iframeFor(videoIds, title){const first=videoIds[0];const rest=videoIds.slice(1);const iframe=document.createElement('iframe');let src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(first)+'?rel=0&modestbranding=1';if(rest.length)src+='&playlist='+rest.map(encodeURIComponent).join(',');iframe.src=src;iframe.title=title||'YouTube player';iframe.referrerPolicy='strict-origin-when-cross-origin';iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';iframe.allowFullscreen=true;return iframe;}
function renderVideos(items, artist){const wrap=document.getElementById('videos');wrap.innerHTML='';if(!items.length){wrap.innerHTML='<div class="msg">このアーティストの取得済み動画がありません。親HTMLで再取得して子HTMLを作り直してください。</div>';return;}items.forEach(item=>{const card=document.createElement('div');card.className='video-card';card.appendChild(iframeFor([item.videoId],item.title));const t=document.createElement('div');t.className='video-title';t.textContent=item.title||'YouTube video';const link=document.createElement('a');link.href='https://www.youtube.com/watch?v='+encodeURIComponent(item.videoId);link.target='_blank';link.rel='noopener';link.className='video-link';link.textContent='YouTubeで開く';card.appendChild(t);card.appendChild(link);wrap.appendChild(card);});}
function playQueue(videos,label){const wrap=document.getElementById('videos');wrap.innerHTML='';if(!videos.length){wrap.innerHTML='<div class="msg">再生できる取得済み動画がありません。</div>';return;}const title=document.getElementById('selectedTitle');const meta=document.getElementById('selectedMeta');title.textContent=label;meta.textContent=videos.length+'本を連続再生します。';const info=document.createElement('div');info.className='queue-info';info.textContent='先頭：'+(videos[0].artist?videos[0].artist+' / ':'')+(videos[0].title||'YouTube video');wrap.appendChild(info);const card=document.createElement('div');card.className='video-card';card.appendChild(iframeFor(videos.map(v=>v.videoId),label));wrap.appendChild(card);const list=document.createElement('div');list.className='msg';list.innerHTML='<b>再生リスト</b><br>'+videos.slice(0,30).map((v,i)=>(i+1)+'. '+(v.artist?escapeHtml(v.artist)+'：':'')+escapeHtml(v.title||v.videoId)).join('<br>')+(videos.length>30?'<br>…ほか '+(videos.length-30)+'本':'');wrap.appendChild(list);}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
document.getElementById('day0814').addEventListener('click',()=>{currentDay='0814';render();});document.getElementById('day0815').addEventListener('click',()=>{currentDay='0815';render();});document.getElementById('clearBookmarks').addEventListener('click',()=>{if(confirm('このブラウザに保存された★をすべて消しますか？')){bookmarks={};saveBookmarks();render();}});
document.getElementById('playFavorites').addEventListener('click',()=>playQueue(uniqueVideosFromArtists(bookmarkedArtists()),'★お気に入り連続再生'));
document.getElementById('playAll').addEventListener('click',()=>playQueue(uniqueVideosFromArtists(allArtists()),'全アーティスト連続再生'));
document.getElementById('playDay').addEventListener('click',()=>playQueue(uniqueVideosFromArtists(dayArtists(currentDay)),DATA[currentDay].label+' 全体連続再生'));
document.getElementById('playRandom').addEventListener('click',()=>playQueue(shuffle(uniqueVideosFromArtists(allArtists())),'ランダム再生'));
render();
</script>
</body></html>
